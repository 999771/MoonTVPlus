name: 打包Windows版EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装项目依赖
        shell: bash
        run: |
          npm install -g pnpm@9
          if [ -f pnpm-workspace.yaml ] && ! grep -q '^packages:' pnpm-workspace.yaml; then
            printf '\npackages:\n  - .\n' >> pnpm-workspace.yaml
          fi
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install
          fi

      - name: 确保开启 standalone 输出
        shell: node {0}
        run: |
          const fs = require('fs');
          const f = fs.readdirSync('.').find(n => /^next\.config\.(js|mjs|cjs|ts)$/.test(n));
          if (!f) { console.log('no next.config, skip'); process.exit(0); }
          let s = fs.readFileSync(f, 'utf8');
          if (s.indexOf('standalone') !== -1) { console.log('standalone already set'); process.exit(0); }
          if (/(const\s+nextConfig[^{]*\{)/.test(s)) {
            s = s.replace(/(const\s+nextConfig[^{]*\{)/, '$1\n  output: "standalone",');
          } else if (/(module\.exports\s*=\s*\{)/.test(s)) {
            s = s.replace(/(module\.exports\s*=\s*\{)/, '$1\n  output: "standalone",');
          } else if (/(export\s+default\s*\{)/.test(s)) {
            s = s.replace(/(export\s+default\s*\{)/, '$1\n  output: "standalone",');
          } else {
            console.log('WARN: 未找到 next.config 插入点');
          }
          fs.writeFileSync(f, s);
          console.log('standalone ensured in ' + f);

      - name: 构建 Next.js
        shell: bash
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: 组装 Electron 外壳（自动登录版）
        shell: bash
        run: |
          mkdir -p pack/webapp/.next
          cp -r .next/standalone/. pack/webapp/
          if [ -d public ]; then cp -r public pack/webapp/public; fi
          cp -r .next/static pack/webapp/.next/static
          cp "$(which node)" pack/node.exe
          echo "内置 Node 版本: $(node --version)"
          mkdir -p pack/electron
          cat > pack/electron/main.js <<'EOF'
            const { app, BrowserWindow, Menu, shell, dialog } = require('electron');
            const { spawn } = require('child_process');
            const path = require('path');
            const fs = require('fs');
            const http = require('http');

            const HOST = '127.0.0.1';
            const PORT = 3690;
            const PASSWORD = '123456';
            let serverProc = null;

            function startServer() {
              const base = app.isPackaged ? process.resourcesPath : path.join(__dirname, '..');
              const serverJs = path.join(base, 'webapp', 'server.js');
              const bundledNode = path.join(base, 'node.exe');
              const useBundledNode = fs.existsSync(bundledNode);

              const env = Object.assign({}, process.env, {
                NODE_ENV: 'production',
                HOSTNAME: HOST,
                PORT: String(PORT),
                PASSWORD: PASSWORD
              });

              const cmd = useBundledNode ? bundledNode : process.execPath;
              if (!useBundledNode) { env.ELECTRON_RUN_AS_NODE = '1'; }

              serverProc = spawn(cmd, [serverJs], {
                env: env,
                stdio: 'ignore',
                windowsHide: true
              });
            }

            function stopServer() {
              if (!serverProc) return;
              try {
                if (process.platform === 'win32') {
                  spawn('taskkill', ['/pid', String(serverProc.pid), '/T', '/F'], { windowsHide: true, stdio: 'ignore' });
                } else {
                  serverProc.kill();
                }
              } catch (e) {}
            }

            function waitForServer() {
              const started = Date.now();
              return new Promise(function (resolve, reject) {
                (function ping() {
                  const req = http.get('http://' + HOST + ':' + PORT, function (res) { res.resume(); resolve(); });
                  req.on('error', function () {
                    if (Date.now() - started > 60000) { reject(new Error('timeout')); }
                    else { setTimeout(ping, 400); }
                  });
                })();
              });
            }

            function autoLogin(win) {
              const script = `
                (function () {
                  var PWD = ${JSON.stringify(PASSWORD)};
                  var n = 0;
                  var timer = setInterval(function () {
                    n++;
                    var input = document.querySelector('input[type="password"]');
                    var form = document.querySelector('form');
                    var btn = form ? form.querySelector('button[type="submit"], button:not([type="button"]):not([type="reset"])') : null;
                    if (!btn) {
                      var all = document.querySelectorAll('button');
                      for (var i = 0; i < all.length; i++) {
                        var t = (all[i].textContent || '').trim().toLowerCase();
                        if (t.indexOf('登录') > -1 || t.indexOf('login') > -1) { btn = all[i]; break; }
                      }
                    }
                    if (input && btn) {
                      try {
                        var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
                        setter.call(input, PWD);
                        input.dispatchEvent(new Event('input', { bubbles: true }));
                      } catch (e) { input.value = PWD; }
                      clearInterval(timer);
                      setTimeout(function () {
                        try {
                          if (form && form.requestSubmit) { form.requestSubmit(); } else { btn.click(); }
                        } catch (e) { btn.click(); }
                      }, 300);
                    } else if (n > 60) {
                      clearInterval(timer);
                    }
                  }, 250);
                })();
              `;
              win.webContents.executeJavaScript(script).catch(function () {});
            }

            function createWindow() {
              Menu.setApplicationMenu(null);
              const win = new BrowserWindow({
                width: 1360,
                height: 850,
                title: 'MoonTVPlus',
                show: false,
                webPreferences: { contextIsolation: true, nodeIntegration: false }
              });
              win.once('ready-to-show', function () { win.show(); });
              win.webContents.setWindowOpenHandler(function (d) {
                if (d.url.indexOf('http') === 0) shell.openExternal(d.url);
                return { action: 'deny' };
              });
              win.webContents.on('did-finish-load', function () {
                const url = (win.webContents.getURL() || '').toLowerCase();
                if (url.indexOf('/login') > -1) { autoLogin(win); }
              });
              win.loadURL('http://' + HOST + ':' + PORT);
            }

            app.whenReady().then(function () {
              startServer();
              waitForServer().then(createWindow).catch(function () {
                dialog.showErrorBox('启动失败', '内置服务未能启动，请重新打开程序试试。');
                app.quit();
              });
            });

            app.on('window-all-closed', function () { app.quit(); });
            app.on('before-quit', stopServer);
          EOF
          cat > pack/electron/package.json <<'EOF'
            {
              "name": "moontvplus-desktop",
              "version": "1.3.0",
              "description": "MoonTVPlus desktop shell",
              "author": "MoonTVPlus",
              "private": true,
              "main": "main.js"
            }
          EOF
          cat > pack/package.json <<'EOF'
            {
              "name": "moontvplus-pack",
              "version": "1.3.0",
              "private": true,
              "devDependencies": {
                "electron": "^33.0.0",
                "electron-builder": "^25.1.8"
              },
              "build": {
                "appId": "com.moontvplus.desktop",
                "productName": "MoonTVPlus",
                "directories": { "output": "dist", "app": "electron" },
                "npmRebuild": false,
                "extraResources": [
                  { "from": "webapp", "to": "webapp" },
                  { "from": "node.exe", "to": "node.exe" }
                ],
                "win": { "target": ["portable", "nsis"] },
                "portable": { "artifactName": "MoonTVPlus-Portable-${version}.exe" },
                "nsis": {
                  "artifactName": "MoonTVPlus-Setup-${version}.exe",
                  "oneClick": false,
                  "allowToChangeInstallationDirectory": true
                }
              }
            }
          EOF

      - name: 打包 EXE
        shell: bash
        run: |
          cd pack
          npm install --no-audit --no-fund
          npx electron-builder --win

      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: MoonTVPlus-Windows
          path: pack/dist/*.exe
          if-no-files-found: error
